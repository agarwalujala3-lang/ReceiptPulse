name: Publish Dashboard to gh-pages

on:
  push:
    branches:
      - main
    paths:
      - "dashboard/**"
      - ".github/workflows/deploy-dashboard-pages.yml"
      - "README.md"
      - "docs/**"
      - "tools/generate_dashboard_config.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages-dashboard
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare static dashboard
        run: |
          mkdir -p dist
          cp -R dashboard/. dist/
          python3 tools/generate_dashboard_config.py pages-demo --output dist/config.js
          touch dist/.nojekyll

      - name: Publish gh-pages branch
        run: |
          cd dist
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Deploy dashboard"
          git branch -M gh-pages
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git push --force origin gh-pages
