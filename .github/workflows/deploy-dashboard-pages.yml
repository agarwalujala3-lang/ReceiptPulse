name: Publish Dashboard to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "dashboard/**"
      - ".github/workflows/deploy-dashboard-pages.yml"
      - "README.md"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-dashboard
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare static dashboard
        run: |
          mkdir -p dist
          cp -R dashboard/. dist/
          cat > dist/config.js <<'EOF'
          window.RECEIPTPULSE_CONFIG = {
            apiBaseUrl: "",
            demo: {
              enabled: true,
              autoFallback: true,
              sampleDataPath: "./data/demo-dashboard.json",
              user: {
                id: "demo-cloud-operator",
                name: "Cloud Demo Operator",
                email: "demo@receiptpulse.dev",
              },
            },
            auth: {
              hostedUiDomain: "",
              clientId: "",
              region: "ap-south-1",
              appPath: "./app.html",
              redirectSignIn: "https://agarwalujala3-lang.github.io/ReceiptPulse/",
              redirectSignOut: "https://agarwalujala3-lang.github.io/ReceiptPulse/",
              scopes: ["openid", "profile"],
            },
          };
          EOF
          touch dist/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
