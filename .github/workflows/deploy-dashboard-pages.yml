name: Publish Dashboard to gh-pages

on:
  push:
    branches:
      - main
    paths:
      - "dashboard/**"
      - ".github/workflows/deploy-dashboard-pages.yml"
      - "README.md"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages-dashboard
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare static dashboard
        run: |
          mkdir -p dist
          cp -R dashboard/. dist/
          cat > dist/config.js <<'EOF'
          window.RECEIPTPULSE_CONFIG = {
            apiBaseUrl: "",
            demo: {
              enabled: true,
              autoFallback: true,
              sampleDataPath: "./data/demo-dashboard.json",
              user: {
                id: "demo-cloud-operator",
                name: "Cloud Demo Operator",
                email: "demo@receiptpulse.dev",
              },
            },
            auth: {
              hostedUiDomain: "",
              clientId: "",
              region: "ap-south-1",
              appPath: "./app.html",
              redirectSignIn: "https://agarwalujala3-lang.github.io/ReceiptPulse/",
              redirectSignOut: "https://agarwalujala3-lang.github.io/ReceiptPulse/",
              scopes: ["openid", "profile"],
            },
          };
          EOF
          touch dist/.nojekyll

      - name: Publish gh-pages branch
        run: |
          cd dist
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Deploy dashboard"
          git branch -M gh-pages
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git push --force origin gh-pages
